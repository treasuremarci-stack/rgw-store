name: Build exact component product photos

on:
  push:
    branches:
      - main
    paths:
      - "tools/fetch_component_photos.py"
      - ".github/workflows/fetch-component-photos.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check -q pillow requests
      - name: Search, download and optimize exact model assets
        run: python tools/fetch_component_photos.py
      - name: Commit generated component assets
        run: |
          git config user.name "aks-photo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add products.json COMPONENTS_PHOTO_PROGRESS.json images/products
          git add rgw_page_gpus.html rgw_page_processors.html rgw_page_motherboards.html rgw_page_ram.html rgw_page_ssd.html rgw_page_hdd.html rgw_page_cases.html rgw_page_power_supplies.html rgw_page_cooling.html
          if git diff --cached --quiet; then
            echo "No component photo changes to commit"
            exit 0
          fi
          git commit -m "Add exact component product photos"
          git push
