name: Fetch exact component photos

on:
  push:
    branches: [main]
    paths:
      - "tools/fetch_component_photos.py"
      - ".github/workflows/fetch_component_photos.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Download and convert exact assets
        run: python -u tools/fetch_component_photos.py

      - name: Commit the generated product assets
        run: |
          rm -f .github/workflows/fetch_component_photos.yml tools/fetch_component_photos.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.json COMPONENTS_PHOTO_PROGRESS.json PROJECT_STATUS.md
          git add rgw_page_gpus.html rgw_page_processors.html rgw_page_motherboards.html
          git add rgw_page_ram.html rgw_page_ssd.html rgw_page_hdd.html
          git add rgw_page_cases.html rgw_page_power_supplies.html rgw_page_cooling.html
          git add images/products
          git add -u
          git commit -m "Add exact component product photos"
          git push origin HEAD:main
