name: Fix Lenovo monoblock image scale

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-lenovo-monoblock-scale.yml
      - tools/fix_lenovo_monoblock_scale.py

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tools
        run: python -m pip install --disable-pip-version-check pillow

      - name: Reframe only Lenovo main photos
        run: python tools/fix_lenovo_monoblock_scale.py

      - name: Commit and push the completed stage
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Fix Lenovo monoblock photo scale [skip ci]'
          git push origin HEAD:main
