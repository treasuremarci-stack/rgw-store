name: Fix gpu-001 photo

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix_gpu001_photo.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Replace gpu-001 photo
        run: python tools/fix_gpu001_photo.py

      - name: Remove temporary tooling
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ("tools/fix_gpu001_photo.py", ".github/workflows/fix_gpu001_photo.yml"):
              path = Path(name)
              if path.exists():
                  path.unlink()
          PY
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary gpu-001 tooling"
          git push origin HEAD:main
