name: Final MSI monoblock gallery

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/monoblock-msi-final.yml
      - scripts/monoblock_msi_final.py

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install --disable-pip-version-check pillow requests
      - name: Use official MSI product gallery
        run: python scripts/monoblock_msi_final.py
