name: Correct monoblock photo assets

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/monoblock-photo-correction.yml
      - scripts/monoblock_photo_correction.py

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install --disable-pip-version-check pillow requests
      - name: Replace rejected monoblock assets
        run: python scripts/monoblock_photo_correction.py
