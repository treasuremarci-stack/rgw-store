name: Monoblock photo stage

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/monoblock-photo-stage.yml
      - scripts/monoblock_photo_stage.py

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install --disable-pip-version-check pillow requests beautifulsoup4
      - name: Download and connect exact monoblock images
        run: python scripts/monoblock_photo_stage.py
