name: One-time published laptop photo URL QA
'on':
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages-photo-qa.yml"
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Check published product and catalog pages
        run: |
          set -euo pipefail
          site="https://treasuremarci-stack.github.io/rgw-store/"
          curl_args=(--fail --location --silent --show-error --retry 5 --retry-delay 3)
          curl "${curl_args[@]}" -o /dev/null "${site}rgw_page_laptops.html"
          for id in laptop-001 laptop-002 laptop-003 laptop-004 laptop-005 laptop-006 laptop-007 laptop-008 laptop-009 laptop-010; do
            curl "${curl_args[@]}" -o /dev/null "${site}product.html?id=${id}"
            echo "page ${id}: 200"
          done
          for path in \
            assets/products/laptop-001/main.webp \
            assets/products/laptop-002/main.webp \
            assets/products/laptop-003/main.webp \
            assets/products/laptop-003/side.webp \
            assets/products/laptop-003/detail.webp \
            assets/products/laptop-003/angle.webp \
            assets/products/laptop-004/main.webp \
            assets/products/laptop-004/back.webp \
            assets/products/laptop-005/main.webp \
            assets/products/laptop-006/main.webp \
            assets/products/laptop-007/main.webp \
            assets/products/laptop-007/angle.webp \
            assets/products/laptop-007/back.webp \
            assets/products/laptop-010/main.webp \
            assets/products/laptop-010/angle.webp \
            assets/products/laptop-010/back.webp; do
            curl "${curl_args[@]}" -o /dev/null "${site}${path}"
            echo "asset ${path}: 200"
          done
