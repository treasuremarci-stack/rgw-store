name: One-time laptop photo background cleanup v2
'on':
  push:
    branches: [main]
    paths:
      - ".github/workflows/photo-background-fix-v2.yml"
  workflow_dispatch:
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - run: python3 -m pip install --disable-pip-version-check --quiet Pillow
      - run: python3 photo_cleanup.py
      - name: Commit photo correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATUS.md assets/products
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: remove embedded white backgrounds from laptop photos"
          git push origin HEAD:main
