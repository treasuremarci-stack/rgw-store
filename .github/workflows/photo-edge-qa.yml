name: One-time laptop photo edge QA
'on':
  push:
    branches: [main]
    paths:
      - ".github/workflows/photo-edge-qa.yml"
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - run: python3 -m pip install --disable-pip-version-check --quiet Pillow
      - name: Inspect image edges
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          paths = [
              "assets/products/laptop-001/main.webp",
              "assets/products/laptop-004/main.webp",
              "assets/products/laptop-004/back.webp",
              "assets/products/laptop-005/main.webp",
              "assets/products/laptop-010/main.webp",
              "assets/products/laptop-010/angle.webp",
              "assets/products/laptop-010/back.webp",
          ]
          for filename in paths:
              image = Image.open(filename).convert("RGBA")
              pixels = image.load()
              edge = []
              for x in range(image.width):
                  edge.append(pixels[x, 0])
                  edge.append(pixels[x, image.height - 1])
              for y in range(1, image.height - 1):
                  edge.append(pixels[0, y])
                  edge.append(pixels[image.width - 1, y])
              opaque = [pixel for pixel in edge if pixel[3] > 0]
              visible = [pixel for pixel in opaque if pixel[3] >= 250]
              if visible:
                  rgb = [(p[0], p[1], p[2]) for p in visible]
                  average = tuple(round(sum(channel[index] for channel in rgb) / len(rgb)) for index in range(3))
                  minimum = tuple(min(channel[index] for channel in rgb) for index in range(3))
                  maximum = tuple(max(channel[index] for channel in rgb) for index in range(3))
              else:
                  average = minimum = maximum = None
              print(f"{filename}: edge_pixels={len(edge)} opaque={len(opaque)} fully_opaque={len(visible)} average={average} min={minimum} max={maximum}")
          PY
