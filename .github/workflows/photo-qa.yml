name: One-time laptop photo visual QA
'on':
  push:
    branches: [main]
    paths:
      - ".github/workflows/photo-qa.yml"
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - run: python3 -m pip install --disable-pip-version-check --quiet Pillow
      - run: python3 photo_qa.py
      - name: Commit temporary QA artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PHOTO_QA.png PHOTO_QA.json
          git commit -m "chore: add temporary laptop photo QA artifacts"
          git push origin HEAD:main
