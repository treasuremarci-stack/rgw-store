name: Process remaining laptop photos
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  process:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check --no-input Pillow
      - name: Download, optimize and connect remaining laptop photos
        run: python scripts/photo_stage2.py
