<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>АКС — Администрирование курса</title>
<style>:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0;padding:32px 16px}.wrap{max-width:560px;margin:4vh auto}.card{background:#fff;border:1px solid #e4e8f0;border-radius:18px;padding:28px;box-shadow:0 12px 36px #1420440a}h1{font-size:26px;margin:0 0 8px}p{color:#657089;line-height:1.55}.muted{font-size:13px}label{display:block;font-size:14px;font-weight:600;margin:18px 0 7px}input{width:100%;padding:13px;border:1px solid #d6dce8;border-radius:10px;font:inherit}button{border:0;border-radius:10px;background:#2758d7;color:#fff;padding:13px 18px;font:inherit;font-weight:600;cursor:pointer;margin-top:16px}button:disabled{opacity:.6;cursor:wait}.secondary{background:#edf1f8;color:#23334d;margin-left:8px}.notice{margin-top:16px;min-height:22px;white-space:pre-wrap}.error{color:#ad2525}.ok{color:#08784b}[hidden]{display:none!important}a{color:#2758d7}</style></head>
<body><main class="wrap"><div class="card"><a href="index.html">← На сайт АКС</a><h1>Управление курсом</h1><p>Курс доллара для цен, поступающих из 1С. Доступ только для администратора.</p>
<section id="login"><form id="loginForm"><label for="email">Email администратора</label><input id="email" type="email" autocomplete="username" required><label for="password">Пароль</label><input id="password" type="password" autocomplete="current-password" required><button id="loginButton" type="submit">Войти</button></form></section>
<section id="panel" hidden><p id="identity" class="muted"></p><form id="rateForm"><label for="rate">1 USD = сколько TJS</label><input id="rate" type="number" min="0.0001" max="999.9999" step="0.0001" inputmode="decimal" required><p class="muted">При сохранении автоматически пересчитываются цены товаров, для которых в базе уже есть цена в USD. Цены без USD не меняются.</p><button id="saveButton" type="submit">Сохранить курс</button><button id="logoutButton" type="button" class="secondary">Выйти</button></form></section>
<div id="notice" class="notice" role="status" aria-live="polite"></div></div></main>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.49.4';
const db=createClient('https://dlpkuifrymxejmhemykm.supabase.co','sb_publishable_WFx_lajJ8BF3yDkGzYCyKg_eyM-t0IF');
const $=id=>document.getElementById(id),msg=(text,error=false)=>{const el=$('notice');el.textContent=text;el.className='notice '+(error?'error':'ok')};
async function showPanel(){const {data:{user},error}=await db.auth.getUser();if(error||!user){$('panel').hidden=true;$('login').hidden=false;return}
const {data:rate,error:rateError}=await db.rpc('aks_admin_get_usd_rate');if(rateError){$('panel').hidden=true;$('login').hidden=false;msg('У аккаунта нет прав администратора. Обратитесь к владельцу проекта.',true);await db.auth.signOut();return}
$('login').hidden=true;$('panel').hidden=false;$('identity').textContent='Администратор: '+user.email;$('rate').value=rate;msg('Текущий курс загружен.')}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginButton').disabled=true;msg('Проверяем вход...');try{const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;$('password').value='';await showPanel()}catch(err){msg('Ошибка входа: '+err.message,true)}finally{$('loginButton').disabled=false}});
$('rateForm').addEventListener('submit',async e=>{e.preventDefault();const value=Number($('rate').value);if(!Number.isFinite(value)||value<=0||value>=1000){msg('Введите курс больше 0 и меньше 1000.',true);return}$('saveButton').disabled=true;msg('Сохраняем и пересчитываем цены...');try{const {data,error}=await db.rpc('aks_admin_set_usd_rate',{new_rate:value});if(error)throw error;$('rate').value=data;msg('Курс сохранён: 1 USD = '+data+' TJS. Пересчёт в базе выполнен.')}catch(err){msg('Не удалось сохранить курс: '+err.message,true)}finally{$('saveButton').disabled=false}});
$('logoutButton').addEventListener('click',async()=>{await db.auth.signOut();$('panel').hidden=true;$('login').hidden=false;msg('Вы вышли из админки.')});
showPanel().catch(err=>msg('Ошибка подключения: '+err.message,true));
</script></body></html>
