<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Товары бренда — АКС</title><link rel="stylesheet" href="rgw_brand.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#151b2d;font:16px system-ui,Arial,sans-serif}header{background:white;border-bottom:1px solid #e4e8f1;padding:20px max(20px,calc((100vw - 1200px)/2))}header a{color:#222;text-decoration:none;font-weight:700}main{max-width:1200px;margin:auto;padding:32px 20px 70px}h1{font-size:32px;margin:0 0 8px}#count{color:#67718a}.group{margin-top:36px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}.item{display:block;background:white;border:1px solid #e4e8f1;border-radius:16px;overflow:hidden;color:inherit;text-decoration:none;transition:.2s}.item:hover{transform:translateY(-3px);box-shadow:0 12px 24px #18203a16}.photo{height:205px;display:flex;align-items:center;justify-content:center;background:white}.photo img{width:100%;height:100%;object-fit:contain;padding:16px}.name{padding:16px;font-weight:600;line-height:1.45}.empty{padding:30px;background:white;border-radius:16px}@media(max-width:600px){h1{font-size:26px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.name{padding:10px;font-size:13px}.photo{height:150px}}
</style></head><body><header><a href="index.html">← АКС — Главная</a></header><main><h1 id="heading">Товары бренда</h1><p id="count">Загрузка каталога…</p><div id="results"></div></main><script>
(async()=>{const allowed=["ASUS","Acer","Lenovo","HP","MSI","Gigabyte","Logitech","TP-Link"];const brand=new URLSearchParams(location.search).get("brand")||"";const selected=allowed.find(b=>b.toLowerCase()===brand.toLowerCase());const heading=document.getElementById("heading"),count=document.getElementById("count"),root=document.getElementById("results");if(!selected){heading.textContent="Бренд не найден";count.textContent="Выберите бренд на главной странице.";return}heading.textContent=selected;document.title=selected+" — АКС";try{const response=await fetch("products.json");if(!response.ok)throw Error("Каталог недоступен");const products=await response.json();const found=products.filter(p=>String(p.brand||"").toLowerCase()===selected.toLowerCase());count.textContent="Товаров: "+found.length;if(!found.length){root.textContent="Пока нет товаров этого бренда.";return}const groups=new Map();for(const p of found){const cat=p.categoryName||p.category||"Другие товары";if(!groups.has(cat))groups.set(cat,[]);groups.get(cat).push(p)}for(const [category,items] of groups){const section=document.createElement("section");section.className="group";const title=document.createElement("h2");title.textContent=category;section.append(title);const grid=document.createElement("div");grid.className="grid";for(const p of items){const link=document.createElement("a");link.className="item";link.href="product.html?id="+encodeURIComponent(p.id);const photo=document.createElement("div");photo.className="photo";if(p.image){const img=document.createElement("img");img.src=p.image;img.alt=p.name||"";img.loading="lazy";img.onerror=()=>{img.remove();photo.textContent=p.placeholder||"📦"};photo.append(img)}else{photo.textContent=p.placeholder||"📦"}const name=document.createElement("div");name.className="name";name.textContent=p.name||"Товар";link.append(photo,name);grid.append(link)}section.append(grid);root.append(section)}}catch(e){count.textContent="Не удалось загрузить товары. Попробуйте обновить страницу."}})();
</script></body></html>
