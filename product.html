<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Товар — АКС</title>
  <meta name="description" content="Карточка товара АКС">
  <link rel="stylesheet" href="rgw_global_catalog.css">
  <link rel="stylesheet" href="rgw_brand.css">
  <style>
    :root{--product-border:#e5e7eb;--product-muted:#667085;--product-soft:#f7f8fb}
    *{box-sizing:border-box}
    body{margin:0;background:#fff;color:#15171d;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    a{color:inherit}
    .product-page{padding:38px 0 84px}
    .breadcrumbs{display:flex;align-items:center;gap:9px;margin-bottom:30px;color:var(--product-muted);font-size:13px}
    .breadcrumbs a{text-decoration:none;color:var(--accent,#635bff)}
    .breadcrumbs a:hover{text-decoration:underline}
    .product-state{max-width:760px;padding:26px;border:1px solid var(--product-border);border-radius:18px;background:var(--product-soft);color:#30343d}
    .product-state.error{border-color:#efb7b7;background:#fff7f7;color:#9c2525}
    .product-shell{display:grid;grid-template-columns:minmax(280px,420px) minmax(0,1fr);gap:54px;align-items:start}
    .product-media{min-width:0}
    .product-visual{display:flex;align-items:center;justify-content:center;min-height:390px;padding:34px;border:1px solid var(--product-border);border-radius:24px;background:linear-gradient(145deg,#fafbff,#f3f4f8);font-size:128px}
    .product-visual img{display:block;max-width:100%;max-height:340px;width:auto;height:auto;object-fit:contain}
    .product-info{min-width:0}
    .product-eyebrow{margin:0 0 9px;color:var(--accent,#635bff);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
    .product-info h1{margin:0;max-width:850px;font-size:clamp(30px,4vw,50px);line-height:1.04;letter-spacing:-.04em}
    .product-sku{margin:13px 0 0;color:var(--product-muted);font-size:14px}
    .product-price{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:30px 0 24px}
    .product-price-label{color:var(--product-muted);font-size:14px}
    .product-price-value{font-size:30px;line-height:1;font-weight:800}
    .product-price-note{color:#9a6700;font-size:13px}
    .product-actions{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:34px}
    .product-action{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 19px;border-radius:12px;text-decoration:none;font-weight:700}
    .product-action.primary{background:#15171d;color:#fff}
    .product-action.primary:hover{background:#635bff}
    .product-action.secondary{border:1px solid var(--product-border);background:#fff}
    .product-action.secondary:hover{border-color:#635bff;color:#635bff}
    .product-section{margin-top:24px;padding-top:24px;border-top:1px solid var(--product-border)}
    .product-section h2{margin:0 0 16px;font-size:20px;letter-spacing:-.02em}
    .spec-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin:0;border:1px solid var(--product-border);border-radius:16px;overflow:hidden}
    .spec-row{display:grid;grid-template-columns:minmax(100px,.8fr) minmax(0,1.2fr);gap:14px;padding:14px 16px;border-bottom:1px solid var(--product-border)}
    .spec-row:nth-child(odd){border-right:1px solid var(--product-border)}
    .spec-row:nth-last-child(-n+2){border-bottom:0}
    .spec-row dt{color:var(--product-muted);font-size:13px}
    .spec-row dd{margin:0;font-size:14px;font-weight:650}
    .spec-source{display:block;margin-top:5px;color:var(--product-muted);font-size:11px;font-weight:400}
    .verification-note{margin:0 0 15px;padding:13px 15px;border-radius:12px;background:#fff8e8;color:#7a5400;font-size:13px;line-height:1.5}
    .source-list{display:grid;gap:9px;margin:0;padding-left:19px;color:var(--product-muted);font-size:13px}
    .source-list a{color:#4d45cf}
    .source-list small{color:#98a0ad}
    @media (max-width:900px){
      .product-page{padding-top:25px}
      .product-shell{grid-template-columns:1fr;gap:28px}
      .product-visual{min-height:280px;font-size:96px}
      .spec-list{grid-template-columns:1fr}
      .spec-row:nth-child(odd){border-right:0}
      .spec-row:nth-last-child(2){border-bottom:1px solid var(--product-border)}
      .spec-row:last-child{border-bottom:0}
    }
    @media (max-width:560px){
      .container{width:min(100% - 28px,1200px)}
      .product-page{padding-bottom:52px}
      .product-info h1{font-size:34px}
      .product-visual{min-height:230px;padding:24px;font-size:76px}
      .product-action{width:100%}
    }
  </style>
</head>
<body>
  <header class="header">
  <div class="container header-shell">
    <div class="header-inner">
      <div class="header-left">
        <a class="brand" href="index.html"><span class="brand-name">АКС</span></a>
        <button class="catalog-trigger" id="catalogTrigger" type="button" aria-expanded="false" aria-controls="catalogMenu"><span class="catalog-trigger-icon">☰</span><span>Каталог</span></button>
      </div>
      <nav class="nav"><a href="index.html">Главная</a><a href="rgw_page_laptops.html" style="color:#635bff">Ноутбуки</a><a href="rgw_page_keyboards.html">Клавиатуры</a><a href="rgw_page_mice.html">Мыши</a><a href="rgw_page_headphones.html">Наушники</a></nav>
      <a class="btn btn-dark" href="index.html#contacts">Связаться</a>
    </div>
    <div class="catalog-backdrop" id="catalogBackdrop"></div>
    <section class="catalog-menu" id="catalogMenu" aria-label="Каталог АКС">
      <div class="catalog-menu-head"><h2>Каталог АКС</h2><button class="catalog-close" id="catalogClose" type="button" aria-label="Закрыть каталог">×</button></div>
      <div class="mega-layout"><div class="mega-categories" id="megaCategories"></div><div class="mega-subcategories" id="megaSubcategories"></div></div>
      <div class="mobile-catalog" id="mobileCatalog"></div>
    </section>
  </div>
</header>
  <main class="product-page">
    <div class="container">
      <nav class="breadcrumbs" aria-label="Хлебные крошки">
        <a href="rgw_page_laptops.html">Ноутбуки</a>
        <span aria-hidden="true">/</span>
        <span id="productBreadcrumb">Товар</span>
      </nav>
      <div id="productStatus" class="product-state" role="status">Загрузка карточки товара…</div>
      <article id="productContent" class="product-shell" hidden>
        <section class="product-media" aria-label="Изображение товара">
          <div id="productVisual" class="product-visual"></div>
        </section>
        <section class="product-info">
          <p id="productBrand" class="product-eyebrow"></p>
          <h1 id="productName"></h1>
          <p id="productSku" class="product-sku"></p>
          <div class="product-price">
            <span class="product-price-label">Цена АКС</span>
            <strong id="productPrice" class="product-price-value"></strong>
            <span id="productPriceNote" class="product-price-note"></span>
          </div>
          <div class="product-actions">
            <a class="product-action primary" href="index.html#contacts">Уточнить наличие</a>
            <a class="product-action secondary" href="rgw_page_laptops.html">Вернуться к ноутбукам</a>
          </div>
          <section class="product-section">
            <h2>Характеристики</h2>
            <dl id="productSpecs" class="spec-list"></dl>
          </section>
          <section class="product-section">
            <h2>Проверка данных</h2>
            <div id="productVerification"></div>
            <ul id="productSources" class="source-list"></ul>
          </section>
        </section>
      </article>
    </div>
  </main>
  <footer class="footer"><div class="container footer-inner"><div class="footer-brand">АКС</div><div>Ноутбуки для работы, учёбы и игр • <a href="index.html#contacts">Связаться с АКС →</a></div></div></footer>
  <script src="rgw_global_catalog.js"></script>
  <script src="product.js"></script>
</body>
</html>
