<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Геймерские наушники</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Фильтры -->
            <div class="col-md-3">
                <div class="filter-section">
                    <h4>Фильтры</h4>
                    
                    <!-- Категории -->
                    <div class="filter-group">
                        <h5>Категории</h5>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="headphones-gaming">
                            <label class="form-check-label" for="headphones-gaming">Геймерские наушники</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="headphones-stereo">
                            <label class="form-check-label" for="headphones-stereo">Стерео наушники</label>
                        </div>
                    </div>

                    <!-- Бренды -->
                    <div class="filter-group">
                        <h5>Бренды</h5>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="brand-steelseries">
                            <label class="form-check-label" for="brand-steelseries">SteelSeries</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="brand-logitech">
                            <label class="form-check-label" for="brand-logitech">Logitech</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="brand-baseus">
                            <label class="form-check-label" for="brand-baseus">Baseus</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="brand-sony">
                            <label class="form-check-label" for="brand-sony">Sony</label>
                        </div>
                    </div>

                    <!-- Цена -->
                    <div class="filter-group">
                        <h5>Цена</h5>
                        <div class="input-group mb-3">
                            <span class="input-group-text">от</span>
                            <input type="number" class="form-control" id="price-min" placeholder="0">
                        </div>
                        <div class="input-group mb-3">
                            <span class="input-group-text">до</span>
                            <input type="number" class="form-control" id="price-max" placeholder="10000">
                        </div>
                    </div>

                    <!-- Специальные характеристики -->
                    <div class="filter-group">
                        <h5>Характеристики</h5>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="feature-wireless">
                            <label class="form-check-label" for="feature-wireless">Беспроводные</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="feature-microphone">
                            <label class="form-check-label" for="feature-microphone">С микрофоном</label>
                        </div>
                    </div>

                    <!-- Кнопка сброса фильтров -->
                    <button class="btn btn-secondary mt-3" onclick="resetFilters()">Сбросить фильтры</button>
                </div>
            </div>

            <!-- Товары -->
            <div class="col-md-9">
                <h2>Геймерские наушники</h2>
                <div id="products-container" class="row">
                    <!-- Карточки товаров будут добавлены сюда через JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Данные о товарах
        const products = [
            {
                id: 1,
                name: "Dialog M251",
                price: 2,
                image: "images/headphones/dialog-m251.jpg",
                category: "headphones-stereo",
                brand: "dialog",
                wireless: false,
                microphone: false
            },
            {
                id: 2,
                name: "Logitech Headset G331",
                price: 33,
                image: "images/headphones/logitech-g331.jpg",
                category: "headphones-stereo",
                brand: "logitech",
                wireless: false,
                microphone: true
            },
            {
                id: 3,
                name: "Logitech Stereo Headset H110",
                price: 8,
                image: "images/headphones/logitech-h110.jpg",
                category: "headphones-stereo",
                brand: "logitech",
                wireless: false,
                microphone: true
            },
            {
                id: 4,
                name: "Baseus Bowie D05 Wireless Headphones",
                price: 18,
                image: "images/headphones/baseus-bowie-d05.jpg",
                category: "headphones-gaming",
                brand: "baseus",
                wireless: true,
                microphone: true
            },
            {
                id: 5,
                name: "Logitech Stereo Headset Н390",
                price: 24,
                image: "images/headphones/logitech-n390.jpg",
                category: "headphones-stereo",
                brand: "logitech",
                wireless: false,
                microphone: true
            },
            {
                id: 6,
                name: "Logitech USB Headset Н340",
                price: 22,
                image: "images/headphones/logitech-n340.jpg",
                category: "headphones-stereo",
                brand: "logitech",
                wireless: false,
                microphone: true
            },
            {
                id: 7,
                name: "Baseus Bowie H1i Noise-Cancellation Wireless Headphones",
                price: 35,
                image: "images/headphones/baseus-bowie-h1i.jpg",
                category: "headphones-gaming",
                brand: "baseus",
                wireless: true,
                microphone: true
            }
        ];

        // Функция для отображения товаров
        function displayProducts(productsToShow) {
            const container = document.getElementById('products-container');
            container.innerHTML = '';

            productsToShow.forEach(product => {
                const productCard = `
                    <div class="col-md-4 mb-4">
                        <div class="card product-card">
                            <img src="${product.image}" class="card-img-top" alt="${product.name}">
                            <div class="card-body">
                                <h5 class="card-title">${product.name}</h5>
                                <p class="card-text">Цена: ${product.price} ₽</p>
                                <button class="btn btn-primary add-to-cart" data-id="${product.id}">В корзину</button>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += productCard;
            });
        }

        // Функция фильтрации товаров
        function filterProducts() {
            const categoryFilters = document.querySelectorAll('.filter-group input[type="checkbox"]:checked');
            const brandFilters = document.querySelectorAll('.filter-group input[type="checkbox"]:checked');
            const priceMin = parseFloat(document.getElementById('price-min').value) || 0;
            const priceMax = parseFloat(document.getElementById('price-max').value) || Infinity;

            let filteredProducts = products.filter(product => {
                // Проверка категории
                let categoryMatch = true;
                if (categoryFilters.length > 0) {
                    categoryMatch = Array.from(categoryFilters).some(filter => 
                        filter.id === product.category
                    );
                }

                // Проверка бренда
                let brandMatch = true;
                if (brandFilters.length > 0) {
                    brandMatch = Array.from(brandFilters).some(filter => 
                        filter.id === `brand-${product.brand}`
                    );
                }

                // Проверка цены
                const priceMatch = product.price >= priceMin && product.price <= priceMax;

                return categoryMatch && brandMatch && priceMatch;
            });

            displayProducts(filteredProducts);
        }

        // Функция сброса фильтров
        function resetFilters() {
            document.querySelectorAll('.filter-group input[type="checkbox"]').forEach(checkbox => {
                checkbox.checked = false;
            });
            document.getElementById('price-min').value = '';
            document.getElementById('price-max').value = '';
            displayProducts(products);
        }

        // Обработчики событий для фильтров
        document.querySelectorAll('.filter-group input[type="checkbox"]').forEach(checkbox => {
            checkbox.addEventListener('change', filterProducts);
        });

        document.getElementById('price-min').addEventListener('input', filterProducts);
        document.getElementById('price-max').addEventListener('input', filterProducts);

        // Инициализация страницы
        document.addEventListener('DOMContentLoaded', function() {
            displayProducts(products);
        });
    </script>
</body>
</html>
